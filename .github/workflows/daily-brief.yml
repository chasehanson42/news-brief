name: Daily News Brief

on:
  schedule:
    # GitHub cron uses UTC. 10:23 UTC = 6:23 AM Eastern (EDT) / 5:23 AM (EST).
    # Off the top of the hour on purpose: GitHub delays or skips many runs
    # scheduled at :00 because that is when most workflows start.
    - cron: "23 10 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and email brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python brief.py

      # Keeps a copy of each report in the run's Artifacts (private to repo collaborators).
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: news-brief-${{ github.run_id }}
          path: reports/*.md
          retention-days: 30
          if-no-files-found: ignore
